# Private CA for the Vagrant lab. Let's Encrypt HTTP-01 needs a public DNS
# name pointing at the cluster; demo.example.com on 172.20.1.50 cannot complete ACME.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nginx-demo-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: nginx-demo-internal-ca
  secretName: nginx-demo-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: nginx-ca-issuer
spec:
  ca:
    secretName: nginx-demo-ca
