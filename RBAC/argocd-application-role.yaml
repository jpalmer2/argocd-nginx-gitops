apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: demo-argocd-applications
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo-argocd-applications
  namespace: argocd
subjects:
  - kind: User
    name: demo
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: demo-argocd-applications
  apiGroup: rbac.authorization.k8s.io
